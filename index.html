<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jigsaw Art Puzzle - Modern Edition (Auto-Save & Draggable UI)</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        :root {
            --primary: #ffffff;
            --primary-hover: #d4d4d4;
            --bg-color: #f8fafc;
            --dot-color: #e2e8f0;
            --modal-bg: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* --- LAYAR PEMILIHAN --- */
        #selection-screen {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
        }

        .preview-section {
            flex: 6.5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }

        .image-preview-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #preview-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 16px;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.25));
            transition: opacity 0.3s ease;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: #222;
            width: 65px;
            height: 65px;
            font-size: 1.8rem;
            font-weight: 600;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .carousel-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-50%) scale(1.1);
        }

        #prev-btn {
            left: 30px;
        }

        #next-btn {
            right: 30px;
        }

        .controls-section {
            flex: 3.5;
            background: #ffffff;
            --text-main: #0a0a0a;
            --text-muted: #5c5c5c;
            --primary: #000000;
            border-left: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.06);
        }

        .selection-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .image-title {
            font-size: 2.2rem;
            color: var(--text-main);
            margin-bottom: 40px;
            font-weight: 800;
            line-height: 1.2;
        }

        .settings-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        select {
            padding: 16px 20px;
            background: #ffffff;
            color: var(--text-main);
            border: 2px solid #d4d4d4;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23111111%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 20px top 50%;
            background-size: 12px auto;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 16px 20px;
            cursor: pointer;
            background: #f5f5f5;
            color: var(--text-main);
            border: 2px dashed #cccccc;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s;
        }

        .custom-file-upload:hover {
            background: #ececec;
            border-color: #000000;
        }

        #start-btn {
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            color: #ffffff;
            border: none;
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #start-btn:hover {
            transform: translateY(-3px);
            background: #000000;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
        }

        /* --- LAYAR PERMAINAN --- */
        #game-screen {
            display: none;
            position: relative;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 20px 20px;
            transition: background-color 0.4s ease;
        }

        #game-screen.dark-theme {
            --bg-color: #0b1120;
            --dot-color: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --modal-bg: rgba(15, 23, 42, 0.92);
        }

        .theme-toggle-btn {
            background: transparent;
            color: var(--text-main);
            border: 2px solid #cbd5e1;
            width: 46px;
            height: 46px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        #game-screen.dark-theme .theme-toggle-btn {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .floating-ui {
            position: absolute;
            top: 24px;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .top-left-ui {
            left: 24px;
            flex-direction: column;
            align-items: flex-start;
            cursor: grab;
            touch-action: none;
        }

        .top-left-ui:active {
            cursor: grabbing;
        }

        .top-right-ui {
            right: 24px;
        }

        .timer {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            padding: 0 8px;
            letter-spacing: 1px;
        }

        .thumb-preview {
            width: 160px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .thumb-preview:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .back-btn {
            background: transparent;
            color: var(--text-main);
            border: 2px solid #cbd5e1;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--text-main);
            color: #fff;
            border-color: var(--text-main);
        }

        #puzzle-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* --- MODAL --- */
        #full-image-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: zoom-out;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        #full-image-modal img {
            max-width: 85vw;
            max-height: 80vh;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .close-modal-hint {
            margin-top: 24px;
            padding: 12px 30px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 30px;
            font-weight: 500;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        #win-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--modal-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 50px 70px;
            border-radius: 24px;
            text-align: center;
            z-index: 80;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            from {
                transform: translate(-50%, -40%) scale(0.8);
                opacity: 0;
            }

            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        #win-modal h2 {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-size: 3.5rem;
            font-weight: 800;
        }

        #win-modal p {
            margin-bottom: 35px;
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        #win-modal button {
            background: var(--text-main);
            color: #fff;
            border: none;
            padding: 16px 45px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #win-modal button:hover {
            background: #000;
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            #selection-screen {
                flex-direction: column;
            }

            .preview-section {
                flex: 1;
                padding: 20px;
            }

            .controls-section {
                flex: none;
                padding: 30px;
                border-left: none;
                border-top: 1px solid #e5e5e5;
            }

            .image-title {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- LAYAR PEMILIHAN -->
    <div id="selection-screen">
        <div class="preview-section">
            <div class="image-preview-container">
                <button class="carousel-btn" id="prev-btn">&#10094;</button>
                <img id="preview-img" src="" alt="Preview">
                <button class="carousel-btn" id="next-btn">&#10095;</button>
            </div>
        </div>

        <div class="controls-section">
            <div class="selection-title">Koleksi Jigsaw</div>
            <h2 class="image-title" id="image-title">Loading...</h2>

            <div class="settings-panel">
                <div class="input-group">
                    <label for="piece-count">Jumlah Pieces</label>
                    <select id="piece-count">
                        <option value="100">100 Pieces</option>
                        <option value="200">200 Pieces</option>
                        <option value="300">300 Pieces</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Mainkan Gambar Sendiri</label>
                    <label class="custom-file-upload">
                        <input type="file" id="upload-input" accept="image/png, image/jpeg, image/jpg">
                        <span id="upload-label-text">+ Unggah Gambar</span>
                    </label>
                </div>

                <button id="start-btn">Mulai Bermain</button>
            </div>
        </div>
    </div>

    <!-- LAYAR PERMAINAN -->
    <div id="game-screen">
        <div class="floating-ui top-left-ui">
            <div class="timer" id="timer">00:00</div>
            <img id="thumb-img" class="thumb-preview" src="" title="Klik untuk lihat referensi" alt="Thumbnail">
        </div>

        <div class="floating-ui top-right-ui">
            <button class="theme-toggle-btn" id="theme-toggle-btn" title="Ganti Tema"><i
                    class="fa-solid fa-moon"></i></button>
            <button class="back-btn" id="back-btn">Kembali</button>
        </div>

        <canvas id="puzzle-canvas"></canvas>

        <div id="win-modal">
            <h2>Luar Biasa!</h2>
            <p id="win-time">Waktu penyelesaian: 00:00</p>
            <button id="play-again-btn">Main Lagi</button>
        </div>
    </div>

    <div id="full-image-modal">
        <img id="full-preview-img" src="" alt="Full Reference">
        <div class="close-modal-hint">Klik di mana saja untuk kembali bermain</div>
    </div>

    <script>
        let puzzleImages = [
            { title: "The Starry Night\nVincent van Gogh", url: "images/starynight.jpg" },
            { title: "Mona Lisa\nLeonardo da Vinci", url: "images/monalisa.jpg" },
            { title: "The Great Wave\nHokusai", url: "images/greatwave.jpg" },
            { title: "Wanderer above Fog\nCaspar David Friedrich", url: "images/fog.jpg" }
        ];

        let currentImageIndex = 0;
        let customImageIndex = -1;
        let pieceCount = 100;
        let imgObj = new Image();

        const selectionScreen = document.getElementById('selection-screen');
        const previewImg = document.getElementById('preview-img');
        const imageTitle = document.getElementById('image-title');
        const pieceSelect = document.getElementById('piece-count');
        const uploadInput = document.getElementById('upload-input');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const startBtn = document.getElementById('start-btn');
        const gameScreen = document.getElementById('game-screen');
        const canvas = document.getElementById('puzzle-canvas');
        const ctx = canvas.getContext('2d');
        const timerEl = document.getElementById('timer');
        const thumbImg = document.getElementById('thumb-img');
        const backBtn = document.getElementById('back-btn');
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const winModal = document.getElementById('win-modal');
        const playAgainBtn = document.getElementById('play-again-btn');
        const fullImageModal = document.getElementById('full-image-modal');
        const fullPreviewImg = document.getElementById('full-preview-img');

        let boardWidth, boardHeight, boardX, boardY;
        let pieces = [];
        let activePieces = [];
        let dragOffsets = [];
        let timerInterval = null;
        let secondsElapsed = 0;
        let needsRedraw = false; // FLAG untuk optimasi render
        let uiHasMoved = false; // Membedakan 'klik' thumbnail dan 'geser' ui

        // --- MANAJEMEN AUTO-SAVE ---
        function saveGameState() {
            if (pieces.length === 0) return;
            const state = {
                currentImageIndex,
                isCustom: customImageIndex !== -1 && customImageIndex === currentImageIndex,
                pieceCount,
                secondsElapsed,
                boardWidth, boardHeight, boardX, boardY,
                piecesData: pieces.map(p => ({
                    id: p.id,
                    groupId: p.groupId,
                    r: p.r,
                    c: p.c,
                    currentX: p.currentX,
                    currentY: p.currentY,
                    edges: p.edges // edges sekarang ikut disimpan
                }))
            };
            try {
                localStorage.setItem('jigsawSaveState', JSON.stringify(state));
                if (state.isCustom) {
                    localStorage.setItem('jigsawCustomImg', puzzleImages[customImageIndex].url);
                }
            } catch (e) {
                console.warn("Gagal menyimpan progress (Quota melebihi batas)");
            }
        }

        function loadGameState() {
            try {
                const save = localStorage.getItem('jigsawSaveState');
                if (!save) return false;
                const state = JSON.parse(save);

                if (state.isCustom) {
                    const customImg = localStorage.getItem('jigsawCustomImg');
                    if (customImg) {
                        if (customImageIndex === -1) {
                            puzzleImages.push({ title: "Custom Image\nUnggahan Anda", url: customImg });
                            customImageIndex = puzzleImages.length - 1;
                        } else {
                            puzzleImages[customImageIndex].url = customImg;
                        }
                        currentImageIndex = customImageIndex;
                    } else {
                        return false;
                    }
                } else {
                    currentImageIndex = state.currentImageIndex;
                }

                pieceCount = state.pieceCount;
                secondsElapsed = state.secondsElapsed;
                boardWidth = state.boardWidth;
                boardHeight = state.boardHeight;
                boardX = state.boardX;
                boardY = state.boardY;

                // Setup UI ke mode in-game
                selectionScreen.style.display = 'none';
                gameScreen.style.display = 'block';
                const currentData = puzzleImages[currentImageIndex];

                // Pastikan thumbnail dipasang
                thumbImg.src = currentData.url;
                fullPreviewImg.src = currentData.url;

                resizeCanvas();
                startTimer(secondsElapsed); // Lanjutkan timer

                imgObj = new Image();
                imgObj.src = currentData.url;
                imgObj.onload = () => {
                    let cols, rows;
                    if (pieceCount === 100) { cols = 10; rows = 10; }
                    else if (pieceCount === 200) { cols = 16; rows = 12; }
                    else if (pieceCount === 300) { cols = 20; rows = 15; }

                    const pieceW = boardWidth / cols;
                    const pieceH = boardHeight / rows;

                    // Bangun ulang Path2D dan kepingan dari data memori
                    pieces = state.piecesData.map(pData => {
                        const path = createPiecePath(pieceW, pieceH, pData.edges);
                        return {
                            id: pData.id, groupId: pData.groupId, r: pData.r, c: pData.c, pieceW, pieceH,
                            currentX: pData.currentX, currentY: pData.currentY, edges: pData.edges, path
                        };
                    });

                    activePieces = [];
                    dragOffsets = [];
                    needsRedraw = true;
                };
                return true;
            } catch (e) {
                console.error("Gagal memuat save data", e);
                return false;
            }
        }

        // --- LOGIKA MENU ---
        function updateSelectionUI() {
            previewImg.style.opacity = 0;
            setTimeout(() => {
                const currentData = puzzleImages[currentImageIndex];
                previewImg.src = currentData.url;
                imageTitle.innerHTML = currentData.title.replace('\n', '<br>');
                previewImg.style.opacity = 1;
            }, 200);
        }

        prevBtn.addEventListener('click', () => { currentImageIndex = (currentImageIndex - 1 + puzzleImages.length) % puzzleImages.length; updateSelectionUI(); });
        nextBtn.addEventListener('click', () => { currentImageIndex = (currentImageIndex + 1) % puzzleImages.length; updateSelectionUI(); });

        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    const labelText = file.name.length > 15 ? file.name.substring(0, 15) + '...' : file.name;
                    document.getElementById('upload-label-text').textContent = `✓ ${labelText}`;
                    if (customImageIndex === -1) {
                        puzzleImages.push({ title: "Custom Image\nUnggahan Anda", url: event.target.result });
                        customImageIndex = puzzleImages.length - 1;
                    } else {
                        puzzleImages[customImageIndex].url = event.target.result;
                    }
                    currentImageIndex = customImageIndex;
                    updateSelectionUI();
                };
                reader.readAsDataURL(file);
            }
            e.target.value = '';
        });

        startBtn.addEventListener('click', () => {
            pieceCount = parseInt(pieceSelect.value);
            selectionScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            const currentData = puzzleImages[currentImageIndex];

            // Set source saat permainan baru dimulai
            thumbImg.src = currentData.url;
            fullPreviewImg.src = currentData.url;

            initGame();
        });

        backBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            gameScreen.style.display = 'none';
            selectionScreen.style.display = 'flex';
            winModal.style.display = 'none';
            // Bersihkan memori progress saat memilih kembali ke menu utama
            localStorage.removeItem('jigsawSaveState');
        });

        themeToggleBtn.addEventListener('click', () => {
            const isDark = gameScreen.classList.toggle('dark-theme');
            themeToggleBtn.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            needsRedraw = true;
        });

        // Event listener thumbnail yang benar
        thumbImg.addEventListener('click', () => {
            if (uiHasMoved) return; // Mencegah terbuka jika tidak sengaja terklik saat drag
            fullImageModal.style.display = 'flex';
        });

        fullImageModal.addEventListener('click', () => { fullImageModal.style.display = 'none'; });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            needsRedraw = true;
        }

        window.addEventListener('resize', () => { if (gameScreen.style.display === 'block') resizeCanvas(); });

        function startTimer(initialSeconds = 0) {
            clearInterval(timerInterval);
            secondsElapsed = initialSeconds;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            timerEl.textContent = `${mins}:${secs}`;
        }

        function initGame() {
            winModal.style.display = 'none';
            resizeCanvas();
            startTimer();
            const currentData = puzzleImages[currentImageIndex];
            imgObj = new Image();
            imgObj.src = currentData.url;
            imgObj.onload = setupPuzzleAndScatter;
            imgObj.onerror = () => {
                clearInterval(timerInterval);
                alert('Gagal memuat gambar.');
                gameScreen.style.display = 'none';
                selectionScreen.style.display = 'flex';
            };
        }

        function createPiecePath(w, h, edges) {
            const tabSize = Math.min(w, h) * 0.26;
            const path = new Path2D();
            path.moveTo(0, 0);
            drawJigsawEdgePath(path, 0, 0, w, 0, edges.top, tabSize);
            drawJigsawEdgePath(path, w, 0, w, h, edges.right, tabSize);
            drawJigsawEdgePath(path, w, h, 0, h, edges.bottom, tabSize);
            drawJigsawEdgePath(path, 0, h, 0, 0, edges.left, tabSize);
            path.closePath();
            return path;
        }

        function drawJigsawEdgePath(path, x1, y1, x2, y2, tabDir, tabSize) {
            if (tabDir === 0) { path.lineTo(x2, y2); return; }
            const dx = x2 - x1, dy = y2 - y1;
            const dist = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);
            const nx = -Math.sin(angle) * tabDir, ny = Math.cos(angle) * tabDir;
            const ux = Math.cos(angle), uy = Math.sin(angle);
            const cp1x = x1 + ux * dist * 0.38, cp1y = y1 + uy * dist * 0.38;
            const cp2x = x1 + ux * dist * 0.62, cp2y = y1 + uy * dist * 0.62;
            const tabCenterX = x1 + ux * dist * 0.5 + nx * tabSize;
            const tabCenterY = y1 + uy * dist * 0.5 + ny * tabSize;
            path.lineTo(cp1x, cp1y);
            path.bezierCurveTo(cp1x + nx * tabSize * 0.8, cp1y + ny * tabSize * 0.8, tabCenterX - ux * tabSize * 0.6, tabCenterY, tabCenterX, tabCenterY);
            path.bezierCurveTo(tabCenterX + ux * tabSize * 0.6, tabCenterY, cp2x + nx * tabSize * 0.8, cp2y + ny * tabSize * 0.8, cp2x, cp2y);
            path.lineTo(x2, y2);
        }

        function setupPuzzleAndScatter() {
            pieces = [];
            activePieces = [];
            dragOffsets = [];

            let cols, rows;
            if (pieceCount === 100) { cols = 10; rows = 10; }
            else if (pieceCount === 200) { cols = 16; rows = 12; }
            else if (pieceCount === 300) { cols = 20; rows = 15; }

            const paddingHorizontal = canvas.width * 0.15;
            const maxBoardW = canvas.width - paddingHorizontal;
            const maxBoardH = canvas.height * 0.65;
            const imgAspect = imgObj.width / imgObj.height;

            if (maxBoardW / maxBoardH > imgAspect) {
                boardHeight = maxBoardH; boardWidth = maxBoardH * imgAspect;
            } else {
                boardWidth = maxBoardW; boardHeight = maxBoardW / imgAspect;
            }

            boardX = (canvas.width - boardWidth) / 2;
            boardY = ((canvas.height - boardHeight) / 2) + 20;

            const pieceW = boardWidth / cols;
            const pieceH = boardHeight / rows;

            const verticalEdges = Array.from({ length: rows }, () => Array(cols - 1).fill(0).map(() => Math.random() < 0.5 ? 1 : -1));
            const horizontalEdges = Array.from({ length: rows - 1 }, () => Array(cols).fill(0).map(() => Math.random() < 0.5 ? 1 : -1));

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const edges = {
                        top: r === 0 ? 0 : -horizontalEdges[r - 1][c],
                        right: c === cols - 1 ? 0 : verticalEdges[r][c],
                        bottom: r === rows - 1 ? 0 : horizontalEdges[r][c],
                        left: c === 0 ? 0 : -verticalEdges[r][c - 1]
                    };

                    const path = createPiecePath(pieceW, pieceH, edges);

                    const randomX = Math.random() * (canvas.width - pieceW);
                    const randomY = Math.max(150, Math.random() * (canvas.height - pieceH));
                    const pId = r * cols + c;

                    pieces.push({
                        id: pId, groupId: pId, r, c, pieceW, pieceH,
                        currentX: randomX, currentY: randomY, edges, path // Menyimpan edges
                    });
                }
            }
            pieces.sort(() => Math.random() - 0.5);
            needsRedraw = true;

            // Simpan saat puzzle selesai dibuat/diacak
            saveGameState();
        }

        // FUNGSI RENDER DIOPTIMISASI
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(100, 116, 139, 0.4)";
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            ctx.strokeRect(boardX, boardY, boardWidth, boardHeight);
            ctx.setLineDash([]);

            for (let p of pieces) {
                ctx.save();
                let isDragging = activePieces.find(ap => ap.id === p.id);
                ctx.translate(p.currentX, p.currentY);

                if (isDragging) {
                    ctx.shadowColor = "rgba(0,0,0,0.5)";
                    ctx.shadowBlur = 15;
                    ctx.shadowOffsetX = 8;
                    ctx.shadowOffsetY = 8;
                    ctx.fillStyle = "#fff";
                    ctx.fill(p.path);
                }

                ctx.save();
                ctx.clip(p.path);
                ctx.drawImage(imgObj, -p.c * p.pieceW, -p.r * p.pieceH, boardWidth, boardHeight);
                ctx.restore();

                ctx.lineWidth = 1.2;
                ctx.strokeStyle = "rgba(0, 0, 0, 0.35)";
                ctx.stroke(p.path);

                ctx.restore();
            }
        }

        // GAME LOOP
        function gameLoop() {
            if (needsRedraw && gameScreen.style.display === 'block') {
                render();
                needsRedraw = false;
            }
            requestAnimationFrame(gameLoop);
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function onPointerDown(e) {
            if (e.target.closest('.floating-ui')) return;
            if (e.cancelable) e.preventDefault();

            const pos = getPointerPos(e);
            let clickedPiece = null;

            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                if (ctx.isPointInPath(p.path, pos.x - p.currentX, pos.y - p.currentY)) {
                    clickedPiece = p;
                    break;
                }
            }

            if (clickedPiece) {
                activePieces = pieces.filter(p => p.groupId === clickedPiece.groupId);
                pieces = pieces.filter(p => p.groupId !== clickedPiece.groupId).concat(activePieces);

                dragOffsets = activePieces.map(p => ({
                    id: p.id,
                    dx: pos.x - p.currentX,
                    dy: pos.y - p.currentY
                }));
                needsRedraw = true;
            }
        }

        function onPointerMove(e) {
            if (activePieces.length === 0) return;
            const pos = getPointerPos(e);

            activePieces.forEach(p => {
                const offset = dragOffsets.find(o => o.id === p.id);
                if (offset) {
                    p.currentX = pos.x - offset.dx;
                    p.currentY = pos.y - offset.dy;
                }
            });
            needsRedraw = true;
        }

        function onPointerUp() {
            if (activePieces.length === 0) return;

            const snapTolerance = 25;
            let snapped = false;

            for (let pA of activePieces) {
                if (snapped) break;

                for (let pB of pieces) {
                    if (pA.groupId === pB.groupId) continue;

                    const isNeighbor = (Math.abs(pA.r - pB.r) === 1 && pA.c === pB.c) || (Math.abs(pA.c - pB.c) === 1 && pA.r === pB.r);
                    if (!isNeighbor) continue;

                    const expectedDx = (pA.c - pB.c) * pA.pieceW;
                    const expectedDy = (pA.r - pB.r) * pA.pieceH;
                    const actualDx = pA.currentX - pB.currentX;
                    const actualDy = pA.currentY - pB.currentY;

                    if (Math.hypot(actualDx - expectedDx, actualDy - expectedDy) < snapTolerance) {
                        const shiftX = (pB.currentX + expectedDx) - pA.currentX;
                        const shiftY = (pB.currentY + expectedDy) - pA.currentY;
                        const newGroupId = pB.groupId;

                        activePieces.forEach(p => { p.currentX += shiftX; p.currentY += shiftY; p.groupId = newGroupId; });
                        snapped = true;
                        break;
                    }
                }
            }

            activePieces = [];
            dragOffsets = [];
            needsRedraw = true;

            // Simpan posisi setiap kali mouse/sentuhan diangkat
            saveGameState();

            checkWinCondition();
        }

        function checkWinCondition() {
            if (pieces.length > 0) {
                const firstGroupId = pieces[0].groupId;
                const allSame = pieces.every(p => p.groupId === firstGroupId);

                if (allSame) {
                    clearInterval(timerInterval);
                    const head = pieces.find(p => p.r === 0 && p.c === 0);
                    const shiftX = boardX - head.currentX;
                    const shiftY = boardY - head.currentY;
                    pieces.forEach(p => { p.currentX += shiftX; p.currentY += shiftY; });
                    needsRedraw = true;

                    document.getElementById('win-time').textContent = `Waktu Anda: ${timerEl.textContent}`;
                    winModal.style.display = 'block';

                    // Bersihkan memori progress karena permainan sudah selesai
                    localStorage.removeItem('jigsawSaveState');
                }
            }
        }

        // --- LOGIKA DRAG PANEL UI ---
        const topLeftUI = document.querySelector('.top-left-ui');
        let isUIDragging = false;
        let uiDragOffsetX = 0;
        let uiDragOffsetY = 0;

        function onUIDragStart(e) {
            isUIDragging = true;
            uiHasMoved = false;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = topLeftUI.getBoundingClientRect();
            uiDragOffsetX = clientX - rect.left;
            uiDragOffsetY = clientY - rect.top;
        }

        function onUIDragMove(e) {
            if (!isUIDragging) return;
            uiHasMoved = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let newX = clientX - uiDragOffsetX;
            let newY = clientY - uiDragOffsetY;
            newX = Math.max(0, Math.min(window.innerWidth - topLeftUI.offsetWidth, newX));
            newY = Math.max(0, Math.min(window.innerHeight - topLeftUI.offsetHeight, newY));

            topLeftUI.style.left = `${newX}px`;
            topLeftUI.style.top = `${newY}px`;
            topLeftUI.style.right = 'auto';
        }

        function onUIDragEnd() {
            isUIDragging = false;
        }

        topLeftUI.addEventListener('mousedown', onUIDragStart);
        window.addEventListener('mousemove', onUIDragMove);
        window.addEventListener('mouseup', onUIDragEnd);
        topLeftUI.addEventListener('touchstart', onUIDragStart, { passive: false });
        window.addEventListener('touchmove', onUIDragMove, { passive: false });
        window.addEventListener('touchend', onUIDragEnd);

        // --- EVENT LISTENERS TAMBAHAN ---
        playAgainBtn.addEventListener('click', initGame);
        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        window.addEventListener('touchmove', onPointerMove, { passive: false });
        window.addEventListener('touchend', onPointerUp);

        // Simpan timer secara periodik saat tab akan disembunyikan/ditutup
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && gameScreen.style.display === 'block') {
                saveGameState();
            }
        });

        // --- INISIALISASI AWAL ---
        // Coba muat memori lokal. Jika tidak ada memori (false), maka muat layar seleksi seperti biasa.
        if (!loadGameState()) {
            updateSelectionUI();
        }

        // Memulai Render Loop
        requestAnimationFrame(gameLoop);
    </script>
</body>

</html>
