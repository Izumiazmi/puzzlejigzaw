<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jigsaw Art Puzzle - Firebase Multiplayer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- SDK Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ffffff;
            --primary-hover: #d4d4d4;
            --bg-color: #f8fafc;
            --dot-color: #e2e8f0;
            --modal-bg: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --text-danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* --- KURSOR MULTIPLAYER --- */
        .multiplayer-cursor {
            position: absolute;
            pointer-events: none;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            transition: transform 0.05s linear;
        }

        .cursor-icon {
            font-size: 1.2rem;
            transform: rotate(-15deg) translateY(-5px);
            filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.5));
        }

        .cursor-name {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 12px;
            margin-top: 2px;
            margin-left: 12px;
            white-space: nowrap;
        }

        /* --- NOTIFIKASI SYSTEM --- */
        #notification-container {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .notification-item {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: var(--shadow-sm);
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            pointer-events: auto;
        }

        .notification-item .close-notif {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .notification-item .close-notif:hover {
            color: var(--text-danger);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* --- LAYAR PEMILIHAN --- */
        #selection-screen {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
        }

        .preview-section {
            flex: 6.5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }

        .image-preview-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #preview-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 16px;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.25));
            transition: opacity 0.3s ease;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: #222;
            width: 65px;
            height: 65px;
            font-size: 1.8rem;
            font-weight: 600;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .carousel-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-50%) scale(1.1);
        }

        #prev-btn {
            left: 30px;
        }

        #next-btn {
            right: 30px;
        }

        .controls-section {
            flex: 3.5;
            background: #ffffff;
            --text-main: #0a0a0a;
            --text-muted: #5c5c5c;
            --primary: #000000;
            border-left: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            padding: 50px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.06);
            overflow-y: auto;
        }

        .selection-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 10px;
            margin-top: auto;
        }

        .image-title {
            font-size: 2.2rem;
            color: var(--text-main);
            margin-bottom: 30px;
            font-weight: 800;
            line-height: 1.2;
        }

        .settings-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-control {
            padding: 16px 20px;
            background: #ffffff;
            color: var(--text-main);
            border: 2px solid #d4d4d4;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
            width: 100%;
        }

        .form-control:focus {
            border-color: #000;
        }

        select.form-control {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23111111%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 20px top 50%;
            background-size: 12px auto;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 16px 20px;
            cursor: pointer;
            background: #f5f5f5;
            color: var(--text-main);
            border: 2px dashed #cccccc;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s;
        }

        .custom-file-upload:hover {
            background: #ececec;
            border-color: #000000;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-primary {
            flex: 2;
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            color: #ffffff;
            border: none;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            background: #000000;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-donate {
            flex: 1;
            background: #f59e0b;
            color: #ffffff;
            border: none;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-donate:hover {
            transform: translateY(-3px);
            background: #d97706;
            box-shadow: 0 15px 25px rgba(245, 158, 11, 0.3);
        }

        .footer-credit {
            margin-top: auto;
            padding-top: 40px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .footer-credit a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }

        .footer-credit a:hover {
            color: #1e40af;
            text-decoration: underline;
        }

        /* --- LAYAR PERMAINAN --- */
        #game-screen {
            display: none;
            position: relative;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 20px 20px;
            transition: background-color 0.4s ease;
        }

        #game-screen.dark-theme {
            --bg-color: #0b1120;
            --dot-color: rgba(255, 255, 255, 0.08);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --modal-bg: rgba(15, 23, 42, 0.92);
        }

        .floating-ui {
            position: absolute;
            top: 24px;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: grab;
            touch-action: none;
        }

        .floating-ui:active {
            cursor: grabbing;
        }

        .top-left-ui {
            left: 24px;
            flex-direction: column;
            align-items: flex-start;
        }

        .top-right-wrapper {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 20;
        }

        .top-right-ui {
            position: relative;
            top: 0;
            right: 0;
            padding: 8px;
            border-radius: 14px;
        }

        .hamburger-btn {
            background: transparent;
            color: var(--text-main);
            border: 2px solid #cbd5e1;
            width: 48px;
            height: 48px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        #game-screen.dark-theme .hamburger-btn {
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* DROPDOWN MENU */
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: var(--modal-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 8px;
            min-width: 250px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 30;
        }

        .dropdown-menu.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .room-badge {
            background: rgba(37, 99, 235, 0.1);
            color: #2563eb;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            border: 1px dashed #2563eb;
            user-select: text;
            font-size: 0.95rem;
        }

        #game-screen.dark-theme .room-badge {
            background: rgba(96, 165, 250, 0.1);
            color: #60a5fa;
            border-color: #60a5fa;
        }

        .dropdown-item {
            background: transparent;
            border: none;
            padding: 12px 15px;
            text-align: left;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dropdown-item:hover {
            background: rgba(0, 0, 0, 0.06);
        }

        #game-screen.dark-theme .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .dropdown-item.no-hover:hover {
            background: transparent;
            cursor: default;
        }

        .dropdown-item i {
            width: 20px;
            text-align: center;
            font-size: 1.1rem;
        }

        /* Toggle Switch CSS */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            margin-left: auto;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #2563eb;
        }

        input:focus+.slider {
            box-shadow: 0 0 1px #2563eb;
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .text-danger {
            color: #ef4444;
        }

        .text-donate {
            color: #f59e0b;
        }

        .timer {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            padding: 0 8px;
            letter-spacing: 1px;
        }

        .thumb-preview {
            width: 160px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .thumb-preview:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        #puzzle-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* --- MODAL GLOBAL --- */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        #full-image-modal {
            cursor: zoom-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        #full-image-modal img {
            max-width: 85vw;
            max-height: 80vh;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .close-modal-hint {
            margin-top: 24px;
            padding: 12px 30px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 30px;
            font-weight: 500;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        #win-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--modal-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 50px 70px;
            border-radius: 24px;
            text-align: center;
            z-index: 80;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            from {
                transform: translate(-50%, -40%) scale(0.8);
                opacity: 0;
            }

            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        #win-modal h2 {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-size: 3.5rem;
            font-weight: 800;
        }

        #win-modal p {
            margin-bottom: 35px;
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        #win-modal button {
            background: var(--text-main);
            color: #fff;
            border: none;
            padding: 16px 45px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #win-modal button:hover {
            background: #000;
            transform: scale(1.05);
        }

        /* CSS MODAL DONASI */
        .modal-content-box {
            background: var(--modal-bg);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            max-width: 400px;
            width: 90%;
            cursor: default;
        }

        #game-screen.dark-theme .modal-content-box {
            background: rgba(15, 23, 42, 0.95);
        }

        .modal-content-box h3 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .modal-content-box p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .qris-img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--text-main);
        }

        @media (max-width: 900px) {
            #selection-screen {
                flex-direction: column;
            }

            .preview-section {
                flex: 1;
                padding: 20px;
            }

            .controls-section {
                flex: none;
                padding: 30px;
                border-left: none;
                border-top: 1px solid #e5e5e5;
            }

            .image-title {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- LAYAR PEMILIHAN -->
    <div id="selection-screen">
        <div class="preview-section">
            <div class="image-preview-container">
                <button class="carousel-btn" id="prev-btn">&#10094;</button>
                <img id="preview-img" src="" alt="Preview">
                <button class="carousel-btn" id="next-btn">&#10095;</button>
            </div>
        </div>

        <div class="controls-section">
            <div class="selection-title">Koleksi Jigsaw</div>
            <h2 class="image-title" id="image-title">Loading...</h2>

            <div class="settings-panel">
                <div class="input-group">
                    <label for="piece-count">Jumlah Pieces</label>
                    <select id="piece-count" class="form-control">
                        <option value="100">100 Pieces</option>
                        <option value="200">200 Pieces</option>
                        <option value="300">300 Pieces</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Mainkan Gambar Sendiri</label>
                    <label class="custom-file-upload">
                        <input type="file" id="upload-input" accept="image/png, image/jpeg, image/jpg">
                        <span id="upload-label-text">+ Unggah Gambar</span>
                    </label>
                </div>

                <!-- Input Room Dikosongkan Default-nya -->
                <div class="input-group">
                    <label for="room-input">Kode Room (Berikan ke Teman)</label>
                    <input type="text" id="room-input" class="form-control" placeholder="Kosongkan untuk buat room baru"
                        autocomplete="off" style="font-weight: 700; color: #2563eb; letter-spacing: 1px;">
                </div>

                <!-- Tombol Mulai & Donasi -->
                <div class="btn-group">
                    <button id="start-btn" class="btn-primary">Mulai Bermain</button>
                    <button class="btn-donate" id="btn-donate-menu">Donasi</button>
                </div>
            </div>

            <!-- Footer Hak Cipta -->
            <div class="footer-credit">
                dibuat oleh <a href="https://izumiazmi.github.io/portfolio" target="_blank">Muhammad Habib Al Azmi</a>
            </div>
        </div>
    </div>

    <!-- LAYAR PERMAINAN -->
    <div id="game-screen">

        <!-- Wadah Notifikasi Pemain Masuk -->
        <div id="notification-container"></div>

        <!-- UI Kiri: Timer & Thumbnail -->

                <div class="dropdown-item no-hover" id="room-lock-container" title="Cegah orang lain bergabung"
                    style="display: none;">
                    <i class="fa-solid fa-lock"></i> Kunci Room
                    <label class="switch">
                        <input type="checkbox" id="room-lock-toggle">
                        <span class="slider"></span>
                    </label>

                <button class="dropdown-item" id="dropdown-theme-btn">
                    <i class="fa-solid fa-moon"></i> Ganti Tema
                </button>
                <button class="dropdown-item text-donate" id="btn-donate-game">
                    <i class="fa-solid fa-heart"></i> Donasi
                </button>

                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Kembali

    <!-- MODAL FULL IMAGE -->
    <div id="full-image-modal" class="modal-overlay">
        <img id="full-preview-img" src="" alt="Full Reference">
        <div class="close-modal-hint">Klik di mana saja untuk kembali bermain</div>

    <!-- MODAL DONASI -->
    <div id="donation-modal" class="modal-overlay">
        <div class="modal-content-box" id="donation-content">
            <button class="close-btn" id="close-donation-btn"><i class="fa-solid fa-xmark"></i></button>
            <h3>Dukung Kami</h3>
            <p>Scan QRIS di bawah ini untuk berdonasi:</p>
            <p>Belum dibuat, kirim aja ke Dana/Gopay : 081374195580</p>
            <img src="images/qris.jpg" alt="QRIS Donasi" class="qris-img">
        </div>
    </div>

    <script>
        // --- INISIALISASI FIREBASE REALTIME DATABASE ---
        const firebaseConfig = {
            databaseURL: "https://jigsaw-backend-eb853-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Data Unik Pemain
        let playerId = localStorage.getItem('jigsawUserId');
        if (!playerId) {
            playerId = 'uid_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('jigsawUserId', playerId);
        }

        const playerColors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
        const playerColor = playerColors[Math.floor(Math.random() * playerColors.length)];
        let roomRef = null;
        let cursors = {};
        let knownPlayers = [];

        let savedPlayerName = localStorage.getItem('jigsawPlayerName') || '';

        // Fungsi Generate Kode Room Unik
        function generateRoomCode() {
            return Math.random().toString(36).substring(2, 7).toUpperCase();
        }

        // Fungsi Tampilkan Notifikasi
        function showNotification(msg) {
            const container = document.getElementById('notification-container');
            const notif = document.createElement('div');
            notif.className = 'notification-item';
            notif.innerHTML = `<span>${msg}</span><button class="close-notif"><i class="fa-solid fa-xmark"></i></button>`;

            container.appendChild(notif);

            notif.querySelector('.close-notif').onclick = () => notif.remove();

            setTimeout(() => {
                if (notif.parentNode) notif.remove();
            }, 4000);
        }

        let puzzleImages = [
            { title: "The Starry Night\nVincent van Gogh", url: "images/starynight.jpg" },
            { title: "Mona Lisa\nLeonardo da Vinci", url: "images/monalisa.jpg" },
            { title: "The Great Wave\nHokusai", url: "images/greatwave.jpg" },
            { title: "Wanderer above Fog\nCaspar David Friedrich", url: "images/fog.jpg" }
        ];

        let currentImageIndex = 0;
        let customImageIndex = -1;
        let pieceCount = 100;
        let activeRoomPin = '';
        let imgObj = new Image();

        const selectionScreen = document.getElementById('selection-screen');
        const previewImg = document.getElementById('preview-img');
        const imageTitle = document.getElementById('image-title');
        const pieceSelect = document.getElementById('piece-count');
        const uploadInput = document.getElementById('upload-input');
        const roomInput = document.getElementById('room-input');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const startBtn = document.getElementById('start-btn');
        const gameScreen = document.getElementById('game-screen');
        const canvas = document.getElementById('puzzle-canvas');
        const ctx = canvas.getContext('2d');
        const timerEl = document.getElementById('timer');
        const thumbImg = document.getElementById('thumb-img');

        const menuToggleBtn = document.getElementById('menu-toggle-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const displayRoomCode = document.getElementById('display-room-code');
        const dropdownThemeBtn = document.getElementById('dropdown-theme-btn');
        const dropdownBackBtn = document.getElementById('dropdown-back-btn');
        const playerNameInput = document.getElementById('player-name-input');
        const roomLockToggle = document.getElementById('room-lock-toggle');
        const roomLockContainer = document.getElementById('room-lock-container');

        const winModal = document.getElementById('win-modal');
        const playAgainBtn = document.getElementById('play-again-btn');
        const fullImageModal = document.getElementById('full-image-modal');
        const fullPreviewImg = document.getElementById('full-preview-img');

        const donationModal = document.getElementById('donation-modal');
        const btnDonateMenu = document.getElementById('btn-donate-menu');
        const btnDonateGame = document.getElementById('btn-donate-game');
        const closeDonationBtn = document.getElementById('close-donation-btn');
        const donationContent = document.getElementById('donation-content');

        let boardWidth, boardHeight, boardX, boardY;
        let pieces = [];
        let activePieces = [];
        let dragOffsets = [];
        let timerInterval = null;
        let secondsElapsed = 0;
        let needsRedraw = false;
        let uiHasMoved = false;

        // --- MANAJEMEN AUTO-SAVE (MENGGUNAKAN RELATIVE KOORDINAT) ---
        function saveGameState() {
            if (pieces.length === 0) return;
            const state = {
                currentImageIndex,
                isCustom: customImageIndex !== -1 && customImageIndex === currentImageIndex,
                pieceCount,
                activeRoomPin,
                secondsElapsed,
                boardWidth, boardHeight, boardX, boardY,
                piecesData: pieces.map(p => ({
                    id: p.id, groupId: p.groupId, r: p.r, c: p.c,
                    rx: (p.currentX - boardX) / boardWidth, // Simpan sebagai koordinat relatif
                    ry: (p.currentY - boardY) / boardHeight,
                    edges: p.edges
                }))
            };
            try {
                localStorage.setItem('jigsawSaveState', JSON.stringify(state));
                if (state.isCustom) localStorage.setItem('jigsawCustomImg', puzzleImages[customImageIndex].url);
            } catch (e) { }
        }

        function loadGameState() {
            try {
                const save = localStorage.getItem('jigsawSaveState');
                if (!save) return false;
                const state = JSON.parse(save);

                if (state.isCustom) {
                    const customImg = localStorage.getItem('jigsawCustomImg');
                    if (customImg) {
                        if (customImageIndex === -1) {
                            puzzleImages.push({ title: "Custom Image\nUnggahan Anda", url: customImg });
                            customImageIndex = puzzleImages.length - 1;
                        } else { puzzleImages[customImageIndex].url = customImg; }
                        currentImageIndex = customImageIndex;
                    } else { return false; }
                } else {
                    currentImageIndex = state.currentImageIndex;
                }

                pieceCount = state.pieceCount;
                activeRoomPin = state.activeRoomPin;
                secondsElapsed = state.secondsElapsed;

                // Jangan gunakan boardWidth dan Height dari save lama jika layar di-resize,
                // biar resizeCanvas menghitung ulang skala barunya. Tapi kita butuh fallback sementara.
                displayRoomCode.textContent = activeRoomPin || 'Offline';

                selectionScreen.style.display = 'none';
                gameScreen.style.display = 'block';
                const currentData = puzzleImages[currentImageIndex];

                thumbImg.src = currentData.url;
                fullPreviewImg.src = currentData.url;

                resizeCanvas();
                startTimer(secondsElapsed);

                imgObj = new Image();
                imgObj.src = currentData.url;
                imgObj.onload = () => {
                    let cols, rows;
                    if (pieceCount === 100) { cols = 10; rows = 10; }
                    else if (pieceCount === 200) { cols = 16; rows = 12; }
                    else if (pieceCount === 300) { cols = 20; rows = 15; }

                    // Perhitungan Board dan Piece Baru sesuai layar saat ini
                    const paddingHorizontal = canvas.width * 0.15;
                    const maxBoardW = canvas.width - paddingHorizontal;
                    const maxBoardH = canvas.height * 0.65;
                    const imgAspect = imgObj.width / imgObj.height;

                    if (maxBoardW / maxBoardH > imgAspect) { boardHeight = maxBoardH; boardWidth = maxBoardH * imgAspect; }
                    else { boardWidth = maxBoardW; boardHeight = maxBoardW / imgAspect; }

                    boardX = (canvas.width - boardWidth) / 2;
                    boardY = ((canvas.height - boardHeight) / 2) + 20;

                    const pieceW = boardWidth / cols;
                    const pieceH = boardHeight / rows;

                    pieces = state.piecesData.map(pData => {
                        const path = createPiecePath(pieceW, pieceH, pData.edges);
                        // Konversi relatif kembali ke absolut menggunakan layar baru
                        let currX = pData.rx !== undefined ? boardX + (pData.rx * boardWidth) : (pData.currentX || 0);
                        let currY = pData.ry !== undefined ? boardY + (pData.ry * boardHeight) : (pData.currentY || 0);

                        return {
                            id: pData.id, groupId: pData.groupId, r: pData.r, c: pData.c, pieceW, pieceH,
                            currentX: currX, currentY: currY, edges: pData.edges, path
                        };
                    });

                    activePieces = [];
                    dragOffsets = [];
                    needsRedraw = true;
                    if (activeRoomPin) joinMultiplayerRoom();
                };
                return true;
            } catch (e) { return false; }
        }

        // --- LOGIKA MENU SELEKSI ---
        function updateSelectionUI() {
            previewImg.style.opacity = 0;
            setTimeout(() => {
                const currentData = puzzleImages[currentImageIndex];
                previewImg.src = currentData.url;
                imageTitle.innerHTML = currentData.title.replace('\n', '<br>');
                previewImg.style.opacity = 1;
            }, 200);
        }

        prevBtn.addEventListener('click', () => { currentImageIndex = (currentImageIndex - 1 + puzzleImages.length) % puzzleImages.length; updateSelectionUI(); });
        nextBtn.addEventListener('click', () => { currentImageIndex = (currentImageIndex + 1) % puzzleImages.length; updateSelectionUI(); });

        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    const labelText = file.name.length > 15 ? file.name.substring(0, 15) + '...' : file.name;
                    document.getElementById('upload-label-text').textContent = `✓ ${labelText}`;
                    if (customImageIndex === -1) {
                        puzzleImages.push({ title: "Custom Image\nUnggahan Anda", url: event.target.result });
                        customImageIndex = puzzleImages.length - 1;
                    } else { puzzleImages[customImageIndex].url = event.target.result; }
                    currentImageIndex = customImageIndex;
                    updateSelectionUI();
                };
                reader.readAsDataURL(file);
            }
            e.target.value = '';
        });

        startBtn.addEventListener('click', () => {
            pieceCount = parseInt(pieceSelect.value);
            const inputPin = roomInput.value.trim().toUpperCase();

            if (inputPin !== '') {
                db.ref(`rooms/${inputPin}`).once('value', (snap) => {
                    if (!snap.exists()) {
                        alert("Room tidak ditemukan. Periksa kembali Kode Room.");
                        return;
                    }
                    if (snap.val().isLocked) {
                        alert("Room ini telah dikunci oleh pemiliknya (Private Room).");
                        return;
                    }

                    activeRoomPin = inputPin;
                    proceedToGame();
                });
            } else {
                activeRoomPin = generateRoomCode();
                proceedToGame();
            }
        });

        function proceedToGame() {
            displayRoomCode.textContent = activeRoomPin;
            selectionScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            const currentData = puzzleImages[currentImageIndex];

            thumbImg.src = currentData.url;
            fullPreviewImg.src = currentData.url;

            initGame();
        }

        // --- LOGIKA MULTIPLAYER FIREBASE REALTIME ---
        function joinMultiplayerRoom() {
            if (activeRoomPin) {
                roomRef = db.ref(`rooms/${activeRoomPin}`);
                let isInitialCursorLoad = true;

                roomRef.child('cursors').once('value', (snapshot) => {
                    const cursorsData = snapshot.val() || {};

                    if (!savedPlayerName) {
                        let count = Object.keys(cursorsData).length;
                        if (!cursorsData[playerId]) count += 1;
                        savedPlayerName = `Player ${count}`;
                        localStorage.setItem('jigsawPlayerName', savedPlayerName);
                    }

                    playerNameInput.value = savedPlayerName;

                    const myCursorRef = roomRef.child(`cursors/${playerId}`);
                    myCursorRef.onDisconnect().remove();

                    myCursorRef.update({
                        name: savedPlayerName,
                        color: playerColor,
                        rx: -1, ry: -1 // Koordinat kursor relatif
                    });
                });

                roomRef.child('owner').on('value', (snap) => {
                    const ownerId = snap.val();
                    if (ownerId === playerId) {
                        roomLockContainer.style.display = 'flex';
                    } else {
                        roomLockContainer.style.display = 'none';
                    }
                });

                roomRef.child('isLocked').on('value', (snap) => {
                    roomLockToggle.checked = !!snap.val();
                });

                roomRef.child('cursors').on('value', (snapshot) => {
                    const allCursors = snapshot.val() || {};

                    if (!isInitialCursorLoad) {
                        Object.keys(allCursors).forEach(id => {
                            if (!knownPlayers.includes(id) && id !== playerId) {
                                const pName = allCursors[id].name || 'Pemain';
                                showNotification(`🎮 ${pName} memasuki game`);
                            }
                        });
                    }

                    knownPlayers = Object.keys(allCursors);
                    isInitialCursorLoad = false;

                    Object.keys(cursors).forEach(id => {
                        if (!allCursors[id] && cursors[id]) {
                            cursors[id].remove();
                            delete cursors[id];
                        }
                    });

                    Object.keys(allCursors).forEach(id => {
                        if (id === playerId) return;
                        const data = allCursors[id];

                        if (!cursors[id]) {
                            const cursorEl = document.createElement('div');
                            cursorEl.className = 'multiplayer-cursor';
                            cursorEl.innerHTML = `
                                <i class="fa-solid fa-arrow-pointer cursor-icon" style="color: ${data.color}"></i>
                                <div class="cursor-name" style="background: ${data.color}">${data.name}</div>
                            `;
                            // PERBAIKAN: Masukkan kursor hanya ke dalam #game-screen
                            document.getElementById('game-screen').appendChild(cursorEl);
                            cursors[id] = cursorEl;
                        }

                        // Konversi relatif ke absolut khusus layar HP/Laptop teman
                        let absX = data.rx !== undefined && data.rx >= 0 ? data.rx * window.innerWidth : -100;
                        let absY = data.ry !== undefined && data.ry >= 0 ? data.ry * window.innerHeight : -100;

                        cursors[id].style.transform = `translate(${absX}px, ${absY}px)`;
                        cursors[id].querySelector('.cursor-name').textContent = data.name;
                    });
                });

                roomRef.child('pieces').once('value', (snapshot) => {
                    if (snapshot.exists()) {
                        const fbPieces = snapshot.val();
                        pieces.forEach(p => {
                            if (fbPieces[p.id]) {
                                // TERIMA KOORDINAT RELATIF
                                if (fbPieces[p.id].rx !== undefined) {
                                    p.currentX = boardX + (fbPieces[p.id].rx * boardWidth);
                                    p.currentY = boardY + (fbPieces[p.id].ry * boardHeight);
                                } else {
                                    p.currentX = fbPieces[p.id].x;
                                    p.currentY = fbPieces[p.id].y;
                                }
                                p.groupId = fbPieces[p.id].groupId !== undefined ? fbPieces[p.id].groupId : p.groupId;
                            }
                        });
                        needsRedraw = true;
                    } else {
                        roomRef.child('owner').set(playerId);
                        roomRef.child('isLocked').set(false);
                        let initialData = {};
                        pieces.forEach(p => {
                            initialData[p.id] = {
                                rx: (p.currentX - boardX) / boardWidth,
                                ry: (p.currentY - boardY) / boardHeight,
                                groupId: p.groupId
                            };
                        });
                        roomRef.child('pieces').set(initialData);
                    }
                });

                roomRef.child('pieces').on('child_changed', (snapshot) => {
                    const pieceData = snapshot.val();
                    const pId = parseInt(snapshot.key);

                    if (activePieces.some(ap => ap.id === pId)) return;

                    const p = pieces.find(piece => piece.id === pId);
                    if (p) {
                        // TERIMA KOORDINAT RELATIF
                        if (pieceData.rx !== undefined) {
                            p.currentX = boardX + (pieceData.rx * boardWidth);
                            p.currentY = boardY + (pieceData.ry * boardHeight);
                        } else {
                            p.currentX = pieceData.x;
                            p.currentY = pieceData.y;
                        }
                        if (pieceData.groupId !== undefined) p.groupId = pieceData.groupId;
                        needsRedraw = true;
                    }
                });
            }
        }

        playerNameInput.addEventListener('input', (e) => {
            savedPlayerName = e.target.value || 'Pemain';
            localStorage.setItem('jigsawPlayerName', savedPlayerName);

            if (roomRef && activeRoomPin) {
                roomRef.child(`cursors/${playerId}`).update({ name: savedPlayerName });
            }
        });

        roomLockToggle.addEventListener('change', (e) => {
            if (roomRef) {
                roomRef.update({ isLocked: e.target.checked });
            }
        });

        // KIRIM KOORDINAT KURSOR SECARA RELATIF (Persentase layar)
        window.addEventListener('mousemove', (e) => {
            if (activeRoomPin && gameScreen.style.display === 'block' && roomRef) {
                roomRef.child(`cursors/${playerId}`).update({
                    rx: e.clientX / window.innerWidth,
                    ry: e.clientY / window.innerHeight
                });
            }
        });

        // --- LOGIKA MODAL DONASI ---
        function openDonationModal() { donationModal.style.display = 'flex'; }
        function closeDonationModal() { donationModal.style.display = 'none'; }
        btnDonateMenu.addEventListener('click', openDonationModal);
        btnDonateGame.addEventListener('click', () => { dropdownMenu.classList.remove('active'); openDonationModal(); });
        closeDonationBtn.addEventListener('click', closeDonationModal);
        donationModal.addEventListener('click', (e) => { if (!donationContent.contains(e.target)) closeDonationModal(); });

        // --- LOGIKA DROPDOWN MENU ---
        menuToggleBtn.addEventListener('click', (e) => {
            if (uiHasMoved) return;
            dropdownMenu.classList.toggle('active');
        });

        document.addEventListener('mousedown', (e) => {
            if (!e.target.closest('.top-right-wrapper')) {
                dropdownMenu.classList.remove('active');
            }
        });

        dropdownBackBtn.addEventListener('click', () => {
            clearInterval(timerInterval);
            gameScreen.style.display = 'none';
            selectionScreen.style.display = 'flex';
            winModal.style.display = 'none';
            dropdownMenu.classList.remove('active');

            localStorage.removeItem('jigsawSaveState');

            if (roomRef) {
                roomRef.child(`cursors/${playerId}`).remove();
                roomRef = null;
            }
            activeRoomPin = '';
            roomInput.value = '';

            updateSelectionUI();
        });

        dropdownThemeBtn.addEventListener('click', () => {
            const isDark = gameScreen.classList.toggle('dark-theme');
            dropdownThemeBtn.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i> Tema Terang' : '<i class="fa-solid fa-moon"></i> Tema Gelap';
            localStorage.setItem('jigsawDarkTheme', isDark);
            needsRedraw = true;
        });

        thumbImg.addEventListener('click', () => { if (!uiHasMoved) fullImageModal.style.display = 'flex'; });
        fullImageModal.addEventListener('click', () => { fullImageModal.style.display = 'none'; });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            needsRedraw = true;
        }

        window.addEventListener('resize', () => { if (gameScreen.style.display === 'block') resizeCanvas(); });

        function startTimer(initialSeconds = 0) {
            clearInterval(timerInterval);
            secondsElapsed = initialSeconds;
            updateTimerDisplay();
            timerInterval = setInterval(() => { secondsElapsed++; updateTimerDisplay(); }, 1000);
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            timerEl.textContent = `${mins}:${secs}`;
        }

        function initGame() {
            winModal.style.display = 'none';
            resizeCanvas();
            startTimer();
            const currentData = puzzleImages[currentImageIndex];
            imgObj = new Image();
            imgObj.src = currentData.url;
            imgObj.onload = () => {
                setupPuzzleAndScatter();
                joinMultiplayerRoom();
            };
        }

        function createPiecePath(w, h, edges) {
            const tabSize = Math.min(w, h) * 0.26;
            const path = new Path2D();
            path.moveTo(0, 0);
            drawJigsawEdgePath(path, 0, 0, w, 0, edges.top, tabSize);
            drawJigsawEdgePath(path, w, 0, w, h, edges.right, tabSize);
            drawJigsawEdgePath(path, w, h, 0, h, edges.bottom, tabSize);
            drawJigsawEdgePath(path, 0, h, 0, 0, edges.left, tabSize);
            path.closePath();
            return path;
        }

        function drawJigsawEdgePath(path, x1, y1, x2, y2, tabDir, tabSize) {
            if (tabDir === 0) { path.lineTo(x2, y2); return; }
            const dx = x2 - x1, dy = y2 - y1;
            const dist = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);
            const nx = -Math.sin(angle) * tabDir, ny = Math.cos(angle) * tabDir;
            const ux = Math.cos(angle), uy = Math.sin(angle);
            const cp1x = x1 + ux * dist * 0.38, cp1y = y1 + uy * dist * 0.38;
            const cp2x = x1 + ux * dist * 0.62, cp2y = y1 + uy * dist * 0.62;
            const tabCenterX = x1 + ux * dist * 0.5 + nx * tabSize;
            const tabCenterY = y1 + uy * dist * 0.5 + ny * tabSize;
            path.lineTo(cp1x, cp1y);
            path.bezierCurveTo(cp1x + nx * tabSize * 0.8, cp1y + ny * tabSize * 0.8, tabCenterX - ux * tabSize * 0.6, tabCenterY, tabCenterX, tabCenterY);
            path.bezierCurveTo(tabCenterX + ux * tabSize * 0.6, tabCenterY, cp2x + nx * tabSize * 0.8, cp2y + ny * tabSize * 0.8, cp2x, cp2y);
            path.lineTo(x2, y2);
        }

        function setupPuzzleAndScatter() {
            pieces = []; activePieces = []; dragOffsets = [];
            let cols, rows;
            if (pieceCount === 100) { cols = 10; rows = 10; }
            else if (pieceCount === 200) { cols = 16; rows = 12; }
            else if (pieceCount === 300) { cols = 20; rows = 15; }

            const paddingHorizontal = canvas.width * 0.15;
            const maxBoardW = canvas.width - paddingHorizontal;
            const maxBoardH = canvas.height * 0.65;
            const imgAspect = imgObj.width / imgObj.height;

            if (maxBoardW / maxBoardH > imgAspect) { boardHeight = maxBoardH; boardWidth = maxBoardH * imgAspect; }
            else { boardWidth = maxBoardW; boardHeight = maxBoardW / imgAspect; }

            boardX = (canvas.width - boardWidth) / 2;
            boardY = ((canvas.height - boardHeight) / 2) + 20;

            const pieceW = boardWidth / cols;
            const pieceH = boardHeight / rows;

            const verticalEdges = Array.from({ length: rows }, () => Array(cols - 1).fill(0).map(() => Math.random() < 0.5 ? 1 : -1));
            const horizontalEdges = Array.from({ length: rows - 1 }, () => Array(cols).fill(0).map(() => Math.random() < 0.5 ? 1 : -1));

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const edges = {
                        top: r === 0 ? 0 : -horizontalEdges[r - 1][c],
                        right: c === cols - 1 ? 0 : verticalEdges[r][c],
                        bottom: r === rows - 1 ? 0 : horizontalEdges[r][c],
                        left: c === 0 ? 0 : -verticalEdges[r][c - 1]
                    };

                    const randomX = Math.random() * (canvas.width - pieceW);
                    const randomY = Math.max(150, Math.random() * (canvas.height - pieceH));
                    const pId = r * cols + c;

                    pieces.push({
                        id: pId, groupId: pId, r, c, pieceW, pieceH,
                        currentX: randomX, currentY: randomY, edges, path: createPiecePath(pieceW, pieceH, edges)
                    });
                }
            }
            pieces.sort(() => Math.random() - 0.5);
            needsRedraw = true;
            saveGameState();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "rgba(100, 116, 139, 0.4)";
            ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
            ctx.strokeRect(boardX, boardY, boardWidth, boardHeight);
            ctx.setLineDash([]);

            for (let p of pieces) {
                ctx.save();
                let isDragging = activePieces.find(ap => ap.id === p.id);
                ctx.translate(p.currentX, p.currentY);

                if (isDragging) {
                    ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 15;
                    ctx.shadowOffsetX = 8; ctx.shadowOffsetY = 8;
                    ctx.fillStyle = "#fff"; ctx.fill(p.path);
                }

                ctx.save();
                ctx.clip(p.path);
                ctx.drawImage(imgObj, -p.c * p.pieceW, -p.r * p.pieceH, boardWidth, boardHeight);
                ctx.restore();

                ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(0, 0, 0, 0.35)"; ctx.stroke(p.path);
                ctx.restore();
            }
        }

        function gameLoop() {
            if (needsRedraw && gameScreen.style.display === 'block') { render(); needsRedraw = false; }
            requestAnimationFrame(gameLoop);
        }

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function onPointerDown(e) {
            if (e.target.closest('.floating-ui') || e.target.closest('.dropdown-menu') || e.target.closest('.notification-item')) return;
            if (e.cancelable) e.preventDefault();

            const pos = getPointerPos(e);
            let clickedPiece = null;

            for (let i = pieces.length - 1; i >= 0; i--) {
                const p = pieces[i];
                if (ctx.isPointInPath(p.path, pos.x - p.currentX, pos.y - p.currentY)) {
                    clickedPiece = p; break;
                }
            }

            if (clickedPiece) {
                activePieces = pieces.filter(p => p.groupId === clickedPiece.groupId);
                pieces = pieces.filter(p => p.groupId !== clickedPiece.groupId).concat(activePieces);
                dragOffsets = activePieces.map(p => ({ id: p.id, dx: pos.x - p.currentX, dy: pos.y - p.currentY }));
                needsRedraw = true;
            }
        }

        function onPointerMove(e) {
            if (activePieces.length === 0) return;
            const pos = getPointerPos(e);
            let minNewX = Infinity, minNewY = Infinity, maxNewX = -Infinity, maxNewY = -Infinity;

            activePieces.forEach(p => {
                const offset = dragOffsets.find(o => o.id === p.id);
                if (offset) {
                    let nx = pos.x - offset.dx, ny = pos.y - offset.dy;
                    if (nx < minNewX) minNewX = nx; if (ny < minNewY) minNewY = ny;
                    if (nx + p.pieceW > maxNewX) maxNewX = nx + p.pieceW;
                    if (ny + p.pieceH > maxNewY) maxNewY = ny + p.pieceH;
                }
            });

            let shiftX = 0, shiftY = 0;
            if (maxNewX > canvas.width) shiftX = canvas.width - maxNewX;
            if (minNewX + shiftX < 0) shiftX = -minNewX;
            if (maxNewY > canvas.height) shiftY = canvas.height - maxNewY;
            if (minNewY + shiftY < 0) shiftY = -minNewY;

            activePieces.forEach(p => {
                const offset = dragOffsets.find(o => o.id === p.id);
                if (offset) {
                    p.currentX = pos.x - offset.dx + shiftX;
                    p.currentY = pos.y - offset.dy + shiftY;

                    // KIRIM KOORDINAT RELATIF PIECE
                    if (activeRoomPin && roomRef) {
                        roomRef.child(`pieces/${p.id}`).update({
                            rx: (p.currentX - boardX) / boardWidth,
                            ry: (p.currentY - boardY) / boardHeight
                        });
                    }
                }
            });
            needsRedraw = true;
        }

        function onPointerUp() {
            if (activePieces.length === 0) return;
            const snapTolerance = 25;
            let snapped = false;

            for (let pA of activePieces) {
                if (snapped) break;
                for (let pB of pieces) {
                    if (pA.groupId === pB.groupId) continue;
                    const isNeighbor = (Math.abs(pA.r - pB.r) === 1 && pA.c === pB.c) || (Math.abs(pA.c - pB.c) === 1 && pA.r === pB.r);
                    if (!isNeighbor) continue;

                    const expectedDx = (pA.c - pB.c) * pA.pieceW, expectedDy = (pA.r - pB.r) * pA.pieceH;
                    const actualDx = pA.currentX - pB.currentX, actualDy = pA.currentY - pB.currentY;

                    if (Math.hypot(actualDx - expectedDx, actualDy - expectedDy) < snapTolerance) {
                        const shiftX = (pB.currentX + expectedDx) - pA.currentX;
                        const shiftY = (pB.currentY + expectedDy) - pA.currentY;
                        const newGroupId = pB.groupId;

                        activePieces.forEach(p => { p.currentX += shiftX; p.currentY += shiftY; p.groupId = newGroupId; });
                        snapped = true; break;
                    }
                }
            }

            if (snapped && activeRoomPin && roomRef) {
                activePieces.forEach(p => {
                    roomRef.child(`pieces/${p.id}`).update({
                        rx: (p.currentX - boardX) / boardWidth,
                        ry: (p.currentY - boardY) / boardHeight,
                        groupId: p.groupId
                    });
                });
            }

            activePieces = []; dragOffsets = []; needsRedraw = true;
            saveGameState(); checkWinCondition();
        }

        function checkWinCondition() {
            if (pieces.length > 0) {
                const firstGroupId = pieces[0].groupId;
                if (pieces.every(p => p.groupId === firstGroupId)) {
                    clearInterval(timerInterval);
                    const head = pieces.find(p => p.r === 0 && p.c === 0);
                    const shiftX = boardX - head.currentX, shiftY = boardY - head.currentY;
                    pieces.forEach(p => { p.currentX += shiftX; p.currentY += shiftY; });
                    needsRedraw = true;

                    document.getElementById('win-time').textContent = `Waktu Anda: ${timerEl.textContent}`;
                    winModal.style.display = 'block';
                    localStorage.removeItem('jigsawSaveState');
                }
            }
        }

        // --- LOGIKA DRAG PANEL UI ---
        const floatingUIs = document.querySelectorAll('.top-left-ui, .top-right-wrapper');
        let activeUIDrag = null, uiDragOffsetX = 0, uiDragOffsetY = 0;

        function onUIDragStart(e) {
            const uiEl = e.target.closest('.top-right-wrapper') || e.target.closest('.top-left-ui');
            if (!uiEl || e.target.closest('.dropdown-menu')) return;

            activeUIDrag = uiEl; isUIDragging = true; uiHasMoved = false;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = activeUIDrag.getBoundingClientRect();
            uiDragOffsetX = clientX - rect.left; uiDragOffsetY = clientY - rect.top;
        }

        function onUIDragMove(e) {
            if (!activeUIDrag) return;
            uiHasMoved = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let newX = clientX - uiDragOffsetX, newY = clientY - uiDragOffsetY;
            newX = Math.max(0, Math.min(window.innerWidth - activeUIDrag.offsetWidth, newX));
            newY = Math.max(0, Math.min(window.innerHeight - activeUIDrag.offsetHeight, newY));
            activeUIDrag.style.left = `${newX}px`; activeUIDrag.style.top = `${newY}px`; activeUIDrag.style.right = 'auto';
        }

        function onUIDragEnd() { activeUIDrag = null; isUIDragging = false; }

        floatingUIs.forEach(ui => {
            ui.addEventListener('mousedown', onUIDragStart);
            ui.addEventListener('touchstart', onUIDragStart, { passive: false });
        });
        window.addEventListener('mousemove', onUIDragMove); window.addEventListener('mouseup', onUIDragEnd);
        window.addEventListener('touchmove', onUIDragMove, { passive: false }); window.addEventListener('touchend', onUIDragEnd);

        playAgainBtn.addEventListener('click', initGame);
        canvas.addEventListener('mousedown', onPointerDown); window.addEventListener('mousemove', onPointerMove); window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, { passive: false }); window.addEventListener('touchmove', onPointerMove, { passive: false }); window.addEventListener('touchend', onPointerUp);

        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && gameScreen.style.display === 'block') saveGameState(); });

        const savedTheme = localStorage.getItem('jigsawDarkTheme');
        if (savedTheme === 'true') {
            gameScreen.classList.add('dark-theme');
            dropdownThemeBtn.innerHTML = '<i class="fa-solid fa-sun"></i> Tema Terang';
        }

        if (!loadGameState()) updateSelectionUI();
        requestAnimationFrame(gameLoop);
    </script>
</body>
